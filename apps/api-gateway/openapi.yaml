  /api/v1/auth/reset-password:
    servers:
      - url: http://localhost:4000
        description: API Gateway Proxy URL
      - url: http://localhost:4001
        description: Local Direct User Service URL
    post:
      operationId: resetPassword
      tags:
        - Authentication
      summary: Reset Password
      description: >-
        Completes the password reset flow by validating the password reset token and writing the new password to the
        account.


        **Request Body Fields:**

        - `passwordResetToken` - Short-lived reset token issued by the OTP verification step.

        - `password` - New account password that must satisfy the password policy.

        - `confirmPassword` - Confirmation value that must match the new password.


        **Response:**

        Returns a success envelope with an empty data payload after the password is updated and existing session cookies
        are cleared.


        **Outcomes:**

        - 200 OK - The password was updated successfully.

        - 400 Bad Request - The token was invalid, expired, or the passwords did not match.

        - 429 Too Many Requests - Password reset was rate-limited.

        - 500 Internal Server Error - The service could not complete the password reset.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                    example: true
                  message:
                    type: string
                    example: Password reset successfully. Please login with your new credentials.

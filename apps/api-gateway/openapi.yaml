        - 200 OK - The profile was updated successfully.
        - 400 Bad Request - The request body failed validation.
        - 401 Unauthorized - Authentication credentials were missing or invalid.
        - 429 Too Many Requests - Profile updates were rate-limited.
        - 500 Internal Server Error - The service could not update the profile.

        **Notes:**
        - The current request schema requires both firstName and lastName.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                    example: true
                  message:
                    type: string
                    example: Profile updated successfully
                  data:
                    $ref: "#/components/schemas/UserResponse"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
                required:
                  - success
                  - message
                  - data
                  - meta
                description: Success Response Envelope
        "400":
          description: Bad Request - Validation or invalid input error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "401":
          description: Unauthorized - Authentication credentials missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponse"
        "429":
          description: Too Many Requests - Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
        "500":
          description: Internal Server Error - Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

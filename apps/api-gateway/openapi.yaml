      properties:
        success:
          type: boolean
          enum:
            - false
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INTERNAL_ERROR
            message:
              type: string
              example: Internal server error.
            details: {}
          required:
            - code

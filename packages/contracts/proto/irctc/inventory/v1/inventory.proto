syntax = "proto3";

package irctc.inventory.v1;

import "google/protobuf/timestamp.proto";

// InventoryService provides RPC methods to query seat inventory details.
service InventoryService {
  // GetSeatMap returns the full seat-map (coaches + seats) for a schedule,
  // marked with bookings that overlap the (from_station, to_station) segment.
  rpc GetSeatMap (GetSeatMapRequest) returns (GetSeatMapResponse);
  // ValidateBooking performs best-effort synchronous pre-flight validation before
  // BookingService.createBooking persists a booking. It validates schedule
  // invariants and, when seat_ids is provided, performs a best-effort check that
  // the requested seats do not currently have overlapping CONFIRMED or active HELD
  // allocations for the requested journey segment.
  rpc ValidateBooking (ValidateBookingRequest) returns (ValidateBookingResponse);
}

// GetSeatMapRequest contains the parameters for fetching a full seat-map.
message GetSeatMapRequest {
  string schedule_id = 1;
  string from_station_id = 2;
  string to_station_id = 3;
}

// GetSeatMapResponse contains the seat-map for a schedule.
//
// `status` is a simple string discriminator:
//   - "OK"                : seats returned; see `coaches[]`.
//   - "SCHEDULE_NOT_FOUND": no schedule with `schedule_id` exists.
//   - "SCHEDULE_INACTIVE" : schedule exists but is cancelled, or the
//                            (from_station, to_station) segment is invalid.
message GetSeatMapResponse {
  string status = 1;
  repeated Coach coaches = 2;
}

// Coach is a single railway coach with its seats in seat-number order.
message Coach {
  string coach_id = 1;
  string coach_number = 2;
  string coach_type = 3;
  int32 total_seats = 4;
  repeated SeatMapSeat seats = 5;
}

// SeatMapSeat is a single seat within a coach, with a live booking flag and status.
message SeatMapSeat {
  string seat_id = 1;
  int32 seat_number = 2;
  string seat_type = 3;
  string berth_type = 4;
  string price = 5;        // decimal string, e.g. "2.5000"
  bool is_booked = 6;
  string quota = 7;
  string status = 8;       // "AVAILABLE", "HELD", "BOOKED"
}

// ValidateBookingRequest is the synchronous pre-flight payload sent by
// BookingService.createBooking. Carries information for inventory-service
// to reject obvious schedule or seat availability failures before the booking row is
// written.
message ValidateBookingRequest {
  string schedule_id      = 1;
  string from_station_id  = 2;
  string to_station_id    = 3;
  // The wall-clock instant at which the booking-side handler began processing
  // the request. Used to compare against the schedule's departure date so
  // both services agree on "has the train left?".
  google.protobuf.Timestamp client_requested_at = 4;
  // Seats selected by the passenger. When provided, inventory validates that
  // none has an overlapping CONFIRMED allocation or an unexpired HELD
  // allocation for the requested journey segment.
  repeated string seat_ids = 5;
}

// ValidateBookingResponse carries validation status and resolved metadata.
// `seat_inventory_ids`, `from_sequence`, and `to_sequence` are populated only when status == OK.
message ValidateBookingResponse {
  // Status represents the result of booking pre-flight validation.
  enum Status {
    // Default/unspecified value. Callers must not treat this as success.
    STATUS_UNSPECIFIED = 0;
    // Schedule, route, and requested seats passed validation.
    OK = 1;
    // Schedule does not exist.
    SCHEDULE_NOT_FOUND = 2;
    // Schedule exists but is not active.
    SCHEDULE_INACTIVE = 3;
    // The (from_station, to_station) segment is invalid for this schedule route.
    INVALID_ROUTE = 4;
    // Departure date has passed (with a small clock-skew tolerance).
    TRAIN_ALREADY_DEPARTED = 5;
    // One or more requested seat IDs do not exist for this schedule or are duplicated.
    INVALID_SEAT_IDS = 6;
    // One or more requested seats have an overlapping active allocation.
    SEAT_UNAVAILABLE = 7;
  }

  Status status                      = 1;
  repeated string seat_inventory_ids = 2;
  int32 from_sequence                = 3;
  int32 to_sequence                  = 4;
}


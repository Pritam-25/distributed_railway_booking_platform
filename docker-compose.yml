name: irctc

services:
  # --- Infrastructure Layer ---

  postgres:
    image: postgres:16-alpine
    container_name: irctc-postgres
    restart: unless-stopped
    profiles: ["prod"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: irctc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - irctc-network
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: irctc-redis
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - irctc-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    container_name: irctc-elasticsearch
    restart: always
    # `debug` is included so `kibana` / `elasticsearch-init` (which sit in
    # both `dev` and `debug`) can resolve this service when only the debug
    # profile is active. dev / prod pull it in via their own profiles.
    profiles: ["dev", "prod", "debug"]
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-password}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-password}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -s -u elastic:${ELASTICSEARCH_PASSWORD:-password} http://localhost:9200/_cluster/health >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - irctc-network

  # --- Messaging Layer (KRaft Mode - Using Confluent Image for stability) ---
  # Two listeners because Kafka clients resolve advertised addresses against
  # their OWN network namespace. `localhost` means the client container (or
  # host), not the broker. Splitting EXTERNAL (host) from INTERNAL (docker
  # network) keeps both client classes happy with one broker.
  #   EXTERNAL :9092  -> advertised as localhost:9092     (host-side `pnpm dev`)
  #   INTERNAL :29092 -> advertised as irctc-kafka:29092  (other containers)

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: irctc-kafka
    restart: always
    profiles: ["dev", "prod"]
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@irctc-kafka:9093"
      KAFKA_LISTENERS: "EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,INTERNAL://irctc-kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - irctc-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: irctc-kafka-ui
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: irctc-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: irctc-kafka:29092
    networks:
      - irctc-network

  # --- Management Tools ---

  pgadmin:
    image: dpage/pgadmin4:9.15.0
    container_name: irctc-pgadmin
    restart: unless-stopped
    profiles: ["debug"]
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@irctc.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-password}
    networks:
      - irctc-network

  redis-insight:
    image: redis/redisinsight:3.4.2
    container_name: irctc-redis-insight
    restart: unless-stopped
    profiles: ["debug"]
    ports:
      - "8001:8001"
    networks:
      - irctc-network

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.4
    container_name: irctc-kibana
    restart: unless-stopped
    profiles: ["dev", "debug"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-init:
        condition: service_completed_successfully
    ports:
      - "5601:5601"
    environment:
      # Match the elasticsearch service's `xpack.security.enabled=true`.
      ELASTICSEARCH_HOSTS: http://irctc-elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-password}
      # Disable telemetry banner + news so the dev UI stays clean.
      TELEMETRY_OPTIMIZATION_ENABLED: "true"
    networks:
      - irctc-network

  # Bootstrap Elasticsearch built-in users that ES 9 does not auto-configure
  # (specifically `kibana_system`). Exits successfully after the password is
  # set; `restart: "no"` prevents endless retries. Mirrors the `kafka-init`
  # one-shot pattern. Required for Kibana to authenticate against ES.
  elasticsearch-init:
    build:
      context: ./infra/elasticsearch-init
      dockerfile: Dockerfile
    container_name: irctc-elasticsearch-init
    profiles: ["dev", "debug"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://irctc-elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-password}
    restart: "no"
    networks:
      - irctc-network

  tempo:
    image: grafana/tempo:latest
    container_name: irctc-tempo
    restart: unless-stopped
    profiles: ["dev", "prod"]
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "3200:3200" # Tempo query API
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    networks:
      - irctc-network

  grafana:
    image: grafana/grafana:latest
    container_name: irctc-grafana
    restart: unless-stopped
    profiles: ["dev", "prod"]
    depends_on:
      - tempo
    ports:
      - "3050:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - irctc-network

  # --- Application Layer ---

  # Creates the OTP and DLQ topics once at stack startup. Topics are not
  # auto-created (allowAutoTopicCreation: false on the producer) so this
  # sidecar is the only source of topic creation. The container exits
  # successfully after the topics are created; restart is "no" so it
  # does not loop.

  kafka-init:
    build:
      context: .
      dockerfile: infra/kafka-init/Dockerfile
      args:
        SERVICE: kafka-init
    container_name: irctc-kafka-init
    profiles: ["dev", "prod"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - irctc-network
    restart: "no"
    environment:
      KAFKA_BROKERS: irctc-kafka:29092

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    container_name: irctc-user-service
    profiles: ["prod"]
    restart: always
    command: sh -c "npx prisma migrate deploy && exec node --import @irctc/telemetry/instrumentation dist/server.js"
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@irctc-postgres:5432/irctc_db
      REDIS_URL: redis://irctc-redis:6379
      KAFKA_BROKERS: irctc-kafka:29092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: ${CORS_ORIGINS:-"http://localhost:3000"}
      SERVICE_NAME: user-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    expose:
      - "4001"
    networks:
      - irctc-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:4001/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  admin-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: admin-service
    container_name: irctc-admin-service
    profiles: ["prod"]
    restart: always
    command: sh -c "npx prisma migrate deploy && exec node --import @irctc/telemetry/instrumentation dist/server.js"
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@irctc-postgres:5432/irctc_db
      KAFKA_BROKERS: irctc-kafka:29092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SERVICE_NAME: admin-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    expose:
      - "4002"
    networks:
      - irctc-network
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:4002/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    container_name: irctc-notification-service
    profiles: ["prod"]
    restart: always
    environment:
      REDIS_URL: redis://irctc-redis:6379
      KAFKA_BROKERS: irctc-kafka:29092
      SERVICE_NAME: notification-service
      EMAIL_VENDOR: SENDGRID
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:?"SendGrid API key is not set."}
      SENDGRID_SENDER: ${SENDGRID_SENDER:?"SendGrid sender is not set."}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    networks:
      - irctc-network
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  search-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: search-service
    container_name: irctc-search-service
    profiles: ["prod"]
    restart: always
    environment:
      PORT: 4004
      REDIS_URL: redis://irctc-redis:6379
      ELASTICSEARCH_NODE: http://irctc-elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-password}
      KAFKA_BROKERS: irctc-kafka:29092
      SERVICE_NAME: search-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    expose:
      - "4004"
    networks:
      - irctc-network
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:4004/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    container_name: irctc-api-gateway
    profiles: ["prod"]
    restart: always
    environment:
      PORT: 4000
      REDIS_URL: redis://irctc-redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-"http://localhost:3000"}
      USER_UPSTREAM: http://irctc-user-service:4001
      ADMIN_UPSTREAM: http://irctc-admin-service:4002
      SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    ports:
      - "4000:4000"
    networks:
      - irctc-network
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      admin-service:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:4000/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

networks:
  irctc-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  tempo_data:
  grafana_data:
  elasticsearch_data:

$kind: http-example
request:
  url: "{{apiUrl}}/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "Jhon",
        "password": "jhon@example.com"
      }

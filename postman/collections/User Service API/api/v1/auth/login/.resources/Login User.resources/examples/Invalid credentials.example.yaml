      {
        "success": false,
        "error": {
          "code": "UNAUTHORIZED",
          "message": "Invalid email or password.",
          "details": ""
        },
        "meta": {
          "requestId": "3e3c1f1a-6f7d-4a2b-9b5c-1f0e3a4b5c6d",
          "traceId": "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4",

$kind: http-example
request:
  url: "{{apiUrl}}/auth/send-otp"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "firstName": {{firstName}},
        "lastName": {{lastName}},
        "email": {{email}},
        "password": {{password}}
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "error": {
          "code": "USER_ALREADY_EXISTS",
          "message": "User already exists.",
          "details": ""
        },
        "meta": {
          "requestId": "3e3c1f1a-6f7d-4a2b-9b5c-1f0e3a4b5c6d",
          "traceId": "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4",
          "timestamp": "2026-07-24T11:21:35.000Z"
        }
      }
order: 3000

  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Password reset successfully. Please login with your new credentials.",
        "data": {},
        "meta": {
          "requestId": "3e3c1f1a-6f7d-4a2b-9b5c-1f0e3a4b5c6d",
          "traceId": "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4",
          "timestamp": "2026-07-24T11:21:35.000Z"
        }
      }
order: 1000

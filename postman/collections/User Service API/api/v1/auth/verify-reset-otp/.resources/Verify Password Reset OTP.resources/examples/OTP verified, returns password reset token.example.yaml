          "traceId": "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4",
          "timestamp": "2026-07-24T11:21:35.000Z"
        }
      }
    $type: |-
      {
        "description": "Success Response Envelope",
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ],
            "example": true
          },
          "message": {
